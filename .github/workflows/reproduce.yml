name: reproduce
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[dev]
      - run: pytest -q
      - run: python -m tasksemantic.experiments
      - uses: actions/upload-artifact@v4
        with:
          name: tasksemantic-results
          path: |
            results/
            figures/
